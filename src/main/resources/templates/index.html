<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{app.page.title}">My Answers</title>
    <meta charset="UTF-8"/>
    <meta name="robots" content="index,follow"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" th:content="#{app.meta.description}"/>
    <link rel="icon" th:href="@{/images/favicon-32x32.png}"/>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-atom-dark.min.css"
          integrity="sha512-GZPS1oCebjx8g/ZkrTTvWirW+4wDkzIsilUQPXcZzuDpDzoH5brM2AojiFjo6ObIWeM68ZDostvdjaS9MNYCTg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
          rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<div class="app-shell">
    <header th:insert="~{fragments/header :: header}"></header>

    <section class="intro">
        <p class="intro__eyebrow" th:text="#{app.intro.eyebrow}">Interactive portfolio</p>
        <h1 class="intro__title" th:text="#{app.intro.title}">Solutions that show how I think</h1>
        <p class="intro__lead" th:text="#{app.intro.lead}">
            Explore Beecrowd challenges solved in Java — read the problem, inspect the code, and run inputs live.
        </p>
        <div class="intro__meta">
            <span class="chip"><i class="bi bi-braces"></i> Java · Spring Boot</span>
            <span class="chip"><i class="bi bi-translate"></i> PT / EN</span>
            <span class="chip"><i class="bi bi-lightning-charge"></i> Live runner</span>
        </div>
    </section>

    <main th:insert="~{fragments/main :: main}"></main>

    <nav class="pager" aria-label="Problem pagination">
        <ul class="pagination" id="nav-pages"></ul>
    </nav>

    <footer class="site-footer">
        <span th:text="#{app.footer}">Built with Spring Boot · Kleber Lima</span>
    </footer>
</div>

<div th:replace="~{fragments/modal-about-me :: modal-about-me}"></div>
<div th:replace="~{fragments/modal-solution :: modal-solution}"></div>

<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.9.0/prism.min.js"
        integrity="sha512-KnX1xdVSdEHliREuSgUX9kgmit/Wk63n4X3cjoWfISEVsi2Qi2NW88dYyKXCCS8YcFMgzHywK3BIafTfhK2Tig=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script th:src="@{/js/index.js}"></script>
<script th:inline="javascript">
    let lang = [[${lang}]];
    let page = [[${pageAnswers}]];
    let inputSizeError = [[#{app.input.size.error}]];
    let inputEmpty = [[#{app.input.empty.error}]];
</script>
</body>
</html>
