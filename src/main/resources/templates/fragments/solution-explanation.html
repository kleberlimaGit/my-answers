<div class="explanation-wrap" th:fragment="solution-explanation">
    <button class="btn btn-ghost btn-sm"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#solutionExplanation"
            aria-expanded="false"
            aria-controls="solutionExplanation">
        <i class="bi bi-lightbulb"></i>
        <span th:text="#{app.explanation.button}">Show explanation</span>
    </button>
    <div class="collapse" id="solutionExplanation">
        <div class="explanation-body" id="solutionExplanationContent"></div>
    </div>
</div>
