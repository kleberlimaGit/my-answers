<main class="workspace" th:fragment="main" id="workspace">
    <section class="panel problem-panel" aria-labelledby="problem-panel-title">
        <div class="panel__bar">
            <h2 class="panel__title" id="problem-panel-title">
                <i class="bi bi-file-text"></i>
                <span th:text="#{app.panel.problem}">Problem</span>
            </h2>
            <span class="problem-number" id="problem-number">#—</span>
        </div>
        <div class="panel__body">
            <div id="editor"></div>
            <div th:insert="~{fragments/solution-explanation :: solution-explanation}"></div>
        </div>
    </section>

    <section class="panel code-panel" aria-labelledby="code-panel-title">
        <div class="panel__bar">
            <h2 class="panel__title" id="code-panel-title">
                <i class="bi bi-code-slash"></i>
                <span th:text="#{app.panel.solution}">Solution</span>
            </h2>
            <button type="button"
                    class="btn btn-ghost btn-sm"
                    id="btn-fullscreen-solution"
                    th:attr="aria-label=#{app.solution.fullscreen}"
                    th:title="#{app.solution.fullscreen}">
                <i class="bi bi-arrows-fullscreen"></i>
                <span class="btn-label-desktop" th:text="#{app.solution.fullscreen}">Fullscreen</span>
            </button>
        </div>
        <div class="panel__body">
            <pre class="code-frame"><code class="language-java" id="code"></code></pre>
            <div class="runner">
                <p class="runner__label" th:text="#{app.runner.label}">Try it</p>
                <div class="runner__row">
                    <input type="text"
                           class="runner__input"
                           id="input-execute"
                           th:placeholder="#{app.placeholder.input}"
                           aria-label="Input value"
                           autocomplete="off"/>
                    <button class="btn btn-primary" type="button" id="btn-execute">
                        <i class="bi bi-play-fill"></i>
                        <span th:text="#{app.button.execute}">Execute</span>
                    </button>
                </div>
                <pre class="output is-empty"
                     id="question-content"
                     th:attr="data-placeholder=#{app.output.placeholder}"></pre>
            </div>
        </div>
    </section>
</main>
