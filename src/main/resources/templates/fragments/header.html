<header th:fragment="header" class="site-header">
    <div class="site-header__inner">
        <a class="brand"
           id="brand-home"
           th:href="@{'/' + ${#locale.language} + '/answers'}"
           onclick="try{sessionStorage.setItem('answers.page.en','0');sessionStorage.setItem('answers.page.pt','0');}catch(e){}">
            <img class="brand__mark" th:src="@{/images/logo-myanswers.svg}" alt="My Answers" width="42" height="42"/>
            <span class="brand__text">
                <span class="brand__name">My Answers</span>
                <span class="brand__tag" th:text="#{app.brand.tag}">Beecrowd solutions</span>
            </span>
        </a>

        <div class="header-actions">
            <div class="lang-switch" role="group" aria-label="Language">
                <a th:href="@{'/en/' + ${langPath != null and !#strings.isEmpty(langPath) ? langPath : 'answers'}}"
                   th:classappend="${#locale.language == 'en'} ? ' is-active'"
                   aria-label="English">
                    <img th:src="@{/images/en-flag.png}" alt=""/>
                </a>
                <a th:href="@{'/pt/' + ${langPath != null and !#strings.isEmpty(langPath) ? langPath : 'answers'}}"
                   th:classappend="${#locale.language == 'pt'} ? ' is-active'"
                   aria-label="Português">
                    <img th:src="@{/images/pt-flag.png}" alt=""/>
                </a>
            </div>

            <a th:href="@{'/' + ${#locale.language} + '/about-me'}"
               class="btn btn-primary"
               id="about_me"
               type="button">
                <i class="bi bi-person"></i>
                <span th:text="#{app.about.me}">About Me</span>
            </a>
        </div>
    </div>
</header>
