<!DOCTYPE html>
<html lang="pt"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{error.title}">Erro</title>
    <meta charset="UTF-8"/>
    <meta name="robots" content="noindex,nofollow"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link rel="icon" th:href="@{/images/favicon-32x32.png}"/>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
          rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<div class="app-shell">
    <header th:insert="~{fragments/header :: header}"></header>

    <main class="error-panel">
        <h1>
            <i class="bi bi-exclamation-triangle" style="color: var(--output-warn)"></i>
            <span th:text="#{error.header}">Ocorreu um erro</span>
        </h1>
        <h2 th:text="${status}"></h2>
        <p class="mb-1" th:text="${error}"></p>
        <p th:text="${message}"></p>
        <a class="btn btn-primary mt-3"
           th:href="@{'/' + ${#locale.language} + '/answers'}"
           th:text="#{error.backToHome}">
            Voltar à página inicial
        </a>
    </main>

    <footer class="site-footer">
        <span th:text="#{app.footer}">Built with Spring Boot · Kleber Lima</span>
    </footer>
</div>

<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
